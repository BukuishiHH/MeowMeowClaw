[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meowmeowclaw"
version = "0.1.0"
description = "MeowMeowClaw: 一个会用工具的本地 CLI Agent(零编排框架)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ddgs",
    "html2text",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
meowmeowclaw = "meowmeowclaw.cli:main"

[tool.setuptools.packages.find]
include = ["meowmeowclaw*"]

# 内置技能正文随包分发: builtin/<技能名>/SKILL.md
[tool.setuptools.package-data]
"meowmeowclaw.skills" = ["builtin/*/SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: 真实联网用例(默认跳过, 需 RUN_NETWORK_TESTS=1 才运行)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# 只开"硬错误": 语法错误 + 未定义名/未使用导入/未使用变量等 pyflakes 规则.
# 不做格式与风格强制(项目中文注释较多, 风格规则噪音大).
select = ["E9", "F"]
